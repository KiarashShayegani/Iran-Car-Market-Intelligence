<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <linearGradient id="kb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2E2E"/>
      <stop offset="0.55" stop-color="#14514F"/>
      <stop offset="1" stop-color="#1B6B62"/>
    </linearGradient>
  </defs>
  <!-- wheel ring: opens at the top-right where the needle escapes -->
  <path d="M 33.8 10.2 A 15.5 15.5 0 1 0 38 22" fill="none" stroke="url(#kb)" stroke-width="3.4" stroke-linecap="round"/>
  <!-- spokes -->
  <g stroke="#14514F" stroke-width="2.6" stroke-linecap="round">
    <line x1="22" y1="22" x2="22" y2="10.5"/>
    <line x1="22" y1="22" x2="12" y2="29"/>
    <line x1="22" y1="22" x2="32" y2="29"/>
  </g>
  <!-- navigation needle: hub → top-right, breaking out of the ring -->
  <line x1="22" y1="22" x2="35.5" y2="8.5" stroke="#1B6B62" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35.5 8.5 L 31.2 10.4 L 34.6 13.2 Z" fill="#1B6B62"/>
  <!-- hub: the priced-listing pulse -->
  <circle cx="22" cy="22" r="3.1" fill="#E6A23C"/>
  <circle cx="22" cy="22" r="1.3" fill="#ffffff"/>
  <!-- needle tip: market pulse -->
  <circle cx="36.8" cy="7.2" r="2.2" fill="#E6A23C"/>
</svg>
