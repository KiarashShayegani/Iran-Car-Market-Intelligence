<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <linearGradient id="kb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2E2E"/>
      <stop offset="0.55" stop-color="#14514F"/>
      <stop offset="1" stop-color="#1B6B62"/>
    </linearGradient>
  </defs>
  <!-- market gauge: open at the bottom, needle rising to the top-right -->
  <path d="M 7.9 27.3 A 15 15 0 1 1 36.1 27.3" fill="none" stroke="url(#kb)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- faint amber ticks flanking the dial -->
  <g stroke="#E6A23C" stroke-width="1.9" stroke-linecap="round" opacity="0.55">
    <line x1="10.8" y1="22.9" x2="15.2" y2="22.9"/>
    <line x1="33.2" y1="22.9" x2="28.8" y2="22.9"/>
  </g>
  <!-- needle: هوش بازار -->
  <line x1="22" y1="23.8" x2="29.9" y2="15" stroke="#E6A23C" stroke-width="3.4" stroke-linecap="round"/>
  <!-- hub -->
  <circle cx="22" cy="24.2" r="3.2" fill="#E6A23C"/>
  <circle cx="22" cy="24.2" r="1.3" fill="#ffffff"/>
</svg>
