# ICMI-local uv configuration.
#
# Package index: standard PyPI by default. If your network cannot reach
# pypi.org directly (e.g. from Iran), do NOT commit a mirror here — instead
# copy .env.example to .env and uncomment the UV_DEFAULT_INDEX line.
# scripts/dev.sh / scripts/dev.ps1 load .env for every ICMI command.
#
# Isolation: never rely on the machine-global uv cache. Run uv through the
# repo-local wrappers so UV_CACHE_DIR always points inside this repository.
python-preference = "only-system"
