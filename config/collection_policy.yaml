# ICMI Collection Policy — per-source operational budgets.
#
# These are MAXIMUM targets per run, not guaranteed yields. The policy is
# loaded and validated before any collection executes; a disabled source
# must never run. collect.py clamps requested pages/listings to these
# ceilings, so no caller can exceed them by accident. Schedules remain
# disabled at the workflow level (owner gate, H-ops-5).
#
# Budgets below are measurement-derived (2026-11-13, see
# docs/internal/DATA_PIPELINE_AUDIT.md):
#   - Sheypoor's unfiltered cursor feed ROTATES (0% overlap between runs
#     28 min apart) — every run is an independent market sample, so
#     twice-daily draws add unique coverage without wasting requests.
#   - Hamrah Mechanic's inventory feed is STABLE (100% overlap at 28 min,
#     12-23% day-over-day) — frequent runs re-observe the same dealer
#     inventory; 2-3x/week stays right.
#   - Bama preset feeds are SEMI-STABLE (~50% overlap at 28 min) — depth
#     per preset enumerates real inventory; the only observed cloud
#     failure followed a 4-run/25-min burst, so: one run per night, never
#     retried same-night.
#
# rotation: for sources with presets, the number of presets per run and
# the deterministic rotation order. Manual dispatches may instead pick
# presets from the coverage report (scripts/rotation_pick.py).

schema_version: 2

defaults:
  request_delay_seconds: 2.0
  request_jitter_seconds: 1.0
  max_retries: 3
  backoff_multiplier: 2
  timeout_seconds: 30
  max_execution_minutes: 20
  stale_page_streak: 3

sources:
  bama:
    enabled: true
    cadence: daily
    max_listings_per_run: 25000   # TEMPORARY: foundation sweep (restore to 60)
    max_pages_per_run: 700        # TEMPORARY: foundation sweep (restore to 3)
    max_pages_per_preset: 2
    max_requests_per_run: 800     # TEMPORARY: foundation sweep (restore to 8)
    presets_per_run: 2
    rotation: deterministic   # presets rotate in listed order
    presets:
      - brand-pride
      - brand-peugeot
      - brand-shahin
      - brand-tara
      - brand-dena
      - brand-quick
      - brand-saina
      - brand-kia
      - brand-toyota
      - brand-kmc
      - brand-fownix
      - brand-lamari
      - brand-lucano
      - brand-reera

  sheypoor:
    enabled: true
    cadence: 2x_daily
    max_listings_per_run: 5000   # TEMPORARY: foundation-probe ceilings (restore after)
    max_pages_per_run: 40
    max_requests_per_run: 50
    presets: []               # full feed, cursor pagination (rotating)

  hamrah_mechanic:
    enabled: true
    cadence: 2-3_per_week
    max_listings_per_run: 5000   # TEMPORARY: foundation-probe ceilings
    max_pages_per_run: 40
    max_requests_per_run: 50
    presets: []

  divar:
    enabled: false
    cadence: manual
    gated: browser-capture-investigation

  karnameh:
    enabled: false
    cadence: manual
    gated: listing-identity
