features:
  categorical:
    - brand_slug
    - name
    - trim
    - fuel
    - transmission
    - body_status
  numerical:
    - year
    - mileage
    - mileage_unknown
    - body_status_ordinal
    - age
  target: price

# Used by src/trainer.py - controls the multi-model comparison and
# per-brand vs. global-fallback split.
training:
  min_samples_per_brand: 60      # brands with fewer rows than this use the global fallback model instead
  test_size: 0.2
  cv_folds: 5
  candidate_models: ["catboost", "xgboost", "random_forest", "mlp"]
  random_seed: 42

