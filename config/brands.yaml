# ICMI v2.0 - Brand & Pipeline Configuration
# All supported brands for the Iranian car market.

scraping:
  source: "bama.ir"
  base_url: "https://bama.ir/cad/api/search"
  request_timeout: 30
  max_retries: 3
  retry_delay: 2
  rate_limit_delay: 1.5
  user_agent: "ICMI-Bot/2.0"
  max_pages_per_brand: 50
  consecutive_empty_threshold: 3

