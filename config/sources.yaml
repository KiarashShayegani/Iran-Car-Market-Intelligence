# ICMI source configuration.
#
# Every collector is fully defined here — endpoints, pagination behavior,
# rate limits, and field support. Endpoints marked `status: experimental` are
# findings from hands-on investigation (see docs/research/), NOT guaranteed
# API contracts. Collectors must verify current behavior before relying on
# them, and treat any structural change as an extraction failure, not a crash.
#
# field_support declares which canonical fields a platform is known to be able
# to provide at all. Fields absent here are `not_supported_by_platform` in
# quality reports; fields listed here but empty on a given ad are
# `missing_in_ad`.

schema_version: 1

pipeline:
  # Bumped whenever extraction logic changes; stored on every record/manifest.
  extraction_version: icmi-v3-extraction-0
  request_timeout_seconds: 30
  request_delay_seconds: 2.0
  request_jitter_seconds: 1.0
  max_retries: 3
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36

sources:
  bama:
    display_name: Bama
    display_name_fa: باما
    enabled: true
    status: experimental
    base_url: https://bama.ir/cad/api/search
    pagination:
      type: page_index
      page_param: pageIndex
      page_size: 12
      page_size_param: pageSize
    # Canonical fields Bama is known to be able to provide (from the research
    # notebook: 100% description coverage on 100 sampled listings).
    # source_published_at is a relative label, not an absolute timestamp.
    # manufacturer_raw is not exposed by the search API.
    field_support:
      - source_listing_id
      - original_url
      - title
      - description
      - brand_raw
      - brand_en_raw
      - model_raw
      - trim_raw
      - year_raw
      - mileage_raw
      - price_raw
      - location_raw
      - fuel_raw
      - transmission_raw
      - body_type_raw
      - body_condition_raw
      - color_raw
      - seller_type
      - seller_id
      - image_urls
      - image_count
      - source_published_at
      - source_modified_at
    notes: >-
      Search API returns JSON with type=='ad' nodes carrying a `detail` object
      under data.ads. Public listing URL from detail.url (relative) or
      metadata.canonical. pageIndex is zero-based.
      Verified live (2026-11-09): the pageSize parameter is NOT honored
      (~24 ads per page returned); response envelope exposes
      data.metadata.{total_count,total_pages,has_next} and the collector uses
      has_next to stop. price values are formatted STRINGS with commas
      ("7,100,000,000"); currency is not exposed (implicitly Toman) —
      normalization to integer happens downstream, raw is preserved.
      seller_type/seller_id appear only on featured ads (rare);
      years may be Gregorian for imported vehicles (preserved raw).
      VERIFIED 2026-11-09: the UNFILTERED default feed ROTATES — two runs of
      the same pageIndex=0 ~1.5h apart shared ZERO listing IDs. The default
      feed is not a stable enumeration basis for market coverage; real
      coverage requires query-based collections (the API accepts a `vehicle`
      param, proven by the v2 scraper). Use collection presets for that.

  sheypoor:
    display_name: Sheypoor
    display_name_fa: شیپور
    enabled: true
    status: experimental
    base_url: https://www.sheypoor.com/api/v10.0.0/search/iran/car
    pagination:
      type: cursor
      page_param: p
      page_size: 24
    # Canonical fields Sheypoor is known to be able to provide (fullAttributes
    # keys: مدل خودرو/سال تولید (چهار رقمی)/کیلومتر/نوع سوخت/گیربکس/
    # نوع شاسی/وضعیت بدنه/رنگ). trim_raw is NOT part of Sheypoor's car
    # attribute schema (0 occurrences across sampled ads) — still extracted
    # if a future ad carries it.
    field_support:
      - source_listing_id
      - original_url
      - title
      - description
      - manufacturer_raw
      - brand_raw
      - model_raw
      - year_raw
      - mileage_raw
      - price_raw
      - location_raw
      - fuel_raw
      - transmission_raw
      - body_type_raw
      - body_condition_raw
      - color_raw
      - seller_type
      - seller_id
      - image_urls
      - image_count
      - source_published_at
    notes: >-
      Ads are type=='normal' nodes with attributes + fullAttributes in the
      خودرو category. Verified live (2026-11-09): a fresh chain starts WITHOUT
      the f cursor (p=0); each response's meta.f is the cursor for the NEXT
      page; meta.p echoes the 1-based page; total/items_per_page allow
      has-more. Price amount is a comma-formatted STRING with currency
      exposed (تومان); raw preserved. source_published_at is the relative
      timePassedLabel; no absolute timestamps exposed. No trim attribute
      exists in the car schema (verified across sampled ads 2026-11-09).

  hamrah_mechanic:
    display_name: Hamrah Mechanic
    display_name_fa: همراه مکانیک
    enabled: true
    status: experimental
    base_url: https://www.hamrah-mechanic.com/api/v1/common/newexhibition
    pagination:
      type: page_number
      page_param: page
      page_size: 24
    # Dealer exhibition inventory: no description, fuel, body type/condition,
    # seller identity, image count, or timestamps in inventory responses.
    field_support:
      - source_listing_id
      - original_url
      - title
      - manufacturer_raw
      - brand_raw
      - model_raw
      - trim_raw
      - year_raw
      - mileage_raw
      - price_raw
      - location_raw
      - transmission_raw
      - color_raw
      - image_urls
    notes: >-
      Records: orderId + carNamePersian; sold vehicles skipped and counted.
      Verified live (2026-11-09): page is 1-BASED and page 1 is the true
      first page (zero overlap with page 2) — the notebook's start-at-2 was
      unnecessary. Public URL built from exhibitionDetailUrl path.
      model_raw is modelEnglishName only (deliberate deviation from the
      notebook, which fell back to the full Persian title).

  divar:
    display_name: Divar
    display_name_fa: دیوار
    enabled: false
    status: deferred_blocked
    base_url: https://api.divar.ir/v8/postlist/w/search
    notes: >-
      HTTP 403 on direct GET/POST investigation. Requires a proper client
      emulation session before it can be a collector candidate.

  karnameh:
    display_name: Karnameh
    display_name_fa: کارنامه
    enabled: false
    status: deferred_identity
    base_url: https://api-gw.karnameh.com/post-storage/car-posts/car-post-list/
    notes: >-
      Listing cards expose useful attributes but no stable listing UUID or
      public page URL in the investigated responses; detail route depends on a
      Next.js build ID. Deferred until listing identity is solved.
