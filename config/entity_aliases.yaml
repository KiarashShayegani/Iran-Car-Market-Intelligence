# Query entity map — Latin and transliterated model references that must
# steer search deterministically (the embedding model confuses short entity
# queries: "AMG" ranks ام جی (MG) ads first, "G class" matches شاهین تیپ G).
#
# Keys: normalize_for_key of the query token/pair (lowercased Latin, Persian
# without spaces). Values: brand (canonical Persian label) and optional model
# label as it appears in bama titles. Curated and reviewable — the corpus
# vocabulary (build_model_vocab) covers the Persian model names automatically.
entities:
  amg: {brand: بنز}
  mercedes: {brand: بنز}
  mercedesbenz: {brand: بنز}
  benz: {brand: بنز}
  gclass: {brand: بنز, model: کلاس G}
