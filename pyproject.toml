[project]
name = "icmi"
version = "3.2.0"
description = "Iranian Car Market Intelligence — multi-source market data, semantic search, and grounded question answering"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.43.126",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "requests>=2.32",
    "sentence-transformers>=3",
    "tenacity>=8.5",
    "torch>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icmi"]

[tool.uv]
python-preference = "only-system"
# Repo-local package cache so plain `uv run` stays isolated too. Note: a
# machine-exported UV_CACHE_DIR env var still wins over this setting — the
# dev wrappers remain the guaranteed-isolation path on such machines.
cache-dir = ".uv-cache"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# torch pinned to the official CPU-only wheel index: the default PyPI linux
# wheel bundles CUDA and would pull multi-GB NVIDIA dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
