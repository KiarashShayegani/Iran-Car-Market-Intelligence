[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ICMI"
version = "2.0.0"
description = "Iran Car Market Intelligence - ML-powered car price estimation and market analytics for Iran's automotive market."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kiarash Shayegani", email = "your.email@example.com"}
]
keywords = [
    "iran", "car", "market", "price-prediction", "machine-learning",
    "automotive", "bama.ir", "scraping", "gradio"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "pandera>=0.18.0",
    "catboost>=1.2.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "gradio>=4.0.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/KiarashShayegani/Iran-Car-Market-Intelligence"
Repository = "https://github.com/KiarashShayegani/Iran-Car-Market-Intelligence"
Issues = "https://github.com/KiarashShayegani/Iran-Car-Market-Intelligence/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "config*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
