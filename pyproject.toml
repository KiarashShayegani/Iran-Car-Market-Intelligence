[project]
name = "icmi"
version = "3.0.0"
description = "Iranian Car Market Intelligence — multi-source market data, semantic search, and grounded question answering"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.43.126",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "requests>=2.32",
    "tenacity>=8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icmi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
